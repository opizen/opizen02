name: 빌드 (Windows / Linux)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 22.04에서 빌드해야 오래된 배포판(glibc 2.35+)에서도 Linux 실행 파일이 동작합니다.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 도구 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 nsis
          rustup update stable
          rustup default stable
          rustup target add x86_64-pc-windows-gnu

      - name: 테스트
        run: cargo test

      - name: Windows 설치 파일 빌드
        run: ./build-windows.sh

      - name: Linux 패키지 빌드 (.deb, .tar.gz)
        run: ./build-linux.sh

      - name: 아티팩트 업로드 (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: opizenAI_Unpack-Windows
          path: dist/*.exe

      - name: 아티팩트 업로드 (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: opizenAI_Unpack-Linux
          path: |
            dist/*.deb
            dist/*.tar.gz

      - name: 릴리스 생성 (v* 태그)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.deb
            dist/*.tar.gz
          generate_release_notes: true
