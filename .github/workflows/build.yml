name: 빌드 (Windows / Linux)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    timeout-minutes: 45
    # 22.04에서 빌드해야 오래된 배포판(glibc 2.35+)에서도 Linux 실행 파일이 동작합니다.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Rust 준비
        run: |
          rustup update stable
          rustup default stable
      - name: 테스트
        run: cargo test --features gui
      - name: Linux 패키지 빌드 (.deb, .tar.gz)
        run: ./build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: opizenAI_Unpack-Linux
          path: |
            dist/*.deb
            dist/*.tar.gz

  windows:
    timeout-minutes: 45
    # RAR(UnRAR) C++ 코드를 링크하려면 새 MinGW가 필요합니다 (22.04의 MinGW는 __mingwthr_key_dtor 오류).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 도구 설치
        # GitHub 러너의 패키지 미러가 응답하지 않는 일이 있어, 멈추면 공식 서버로 바꿔 다시 시도
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          for i in 1 2 3; do
            if timeout 180 sudo apt-get $APT update; then break; fi
            echo "패키지 서버 응답 없음 → archive.ubuntu.com 으로 바꿔 다시 시도 ($i)"
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu/\?#http://archive.ubuntu.com/ubuntu/#g' \
              /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          done
          timeout 600 sudo apt-get $APT install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64 nsis
          rustup update stable
          rustup default stable
          rustup target add x86_64-pc-windows-gnu
      - name: Windows 설치 파일 빌드
        timeout-minutes: 30
        run: ./build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: opizenAI_Unpack-Windows
          path: dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 릴리스 생성 (v* 태그)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.deb
            dist/*.tar.gz
          generate_release_notes: true
