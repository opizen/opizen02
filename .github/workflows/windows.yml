name: Windows 설치 파일

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 도구 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 nsis
          rustup target add x86_64-pc-windows-gnu

      - name: 테스트
        run: cargo test

      - name: Windows 설치 파일 빌드
        run: ./build-windows.sh

      - name: 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: UnpackSetup
          path: dist/*.exe

      - name: 릴리스 생성 (v* 태그)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
