[package]
name = "opizenai-unpack"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "opizenAI_Unpack — 압축 해제 프로그램 (CLI + GUI, Windows / Linux)"

[lib]
name = "unpack"
path = "src/lib.rs"

[[bin]]
name = "unpack"
path = "src/main.rs"

[[bin]]
name = "opizenAI_Unpack"
path = "src/bin/gui/main.rs"
required-features = ["gui"]

[dependencies]
anyhow = "1.0.104"
bzip2 = "0.6.1"
clap = { version = "4.6.8", features = ["derive"] }
eframe = { version = "0.37.0", optional = true }
flate2 = "1.1.11"
rfd = { version = "0.18.0", optional = true }
sevenz-rust2 = "0.25.0"
tar = "0.4.46"
time = { version = "0.3.55", features = ["local-offset"] }
xz2 = "0.1.7"
zip = "9.7.0"
zstd = "0.14.4"

[dev-dependencies]
bzip2 = "0.6.1"
flate2 = "1.1.11"
sevenz-rust2 = "0.25.0"
tar = "0.4.46"
tempfile = "3.27.0"
xz2 = "0.1.7"
zip = "9.7.0"
zstd = "0.14.4"

[features]
default = []
# 데스크톱 GUI 앱 (opizenAI_Unpack) — Windows / Linux
gui = ["dep:eframe", "dep:rfd"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1

[build-dependencies]
winresource = "0.1.34"
