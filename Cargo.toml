[package]
name = "opizenai-unpack"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "opizenAI_Unpack — 압축 해제 프로그램 (CLI + GUI, Windows / Linux)"

[lib]
name = "unpack"
path = "src/lib.rs"

[[bin]]
name = "unpack"
path = "src/main.rs"

[[bin]]
name = "opizenAI_Unpack"
path = "src/bin/gui/main.rs"
required-features = ["gui"]

[dependencies]
anyhow = "1.0.104"
bzip2 = "0.6.1"
clap = { version = "4.6.8", features = ["derive"] }
eframe = { version = "0.37.0", optional = true }
encoding_rs = "0.8.44"
flate2 = "1.1.11"
fs4 = "1.1.0"
rfd = { version = "0.18.0", optional = true }
sevenz-rust2 = "0.25.0"
tar = "0.4.46"
time = { version = "0.3.55", features = ["local-offset"] }
trash = "5.4.0"
unrar = { version = "0.5.8", optional = true }
xz2 = "0.1.7"
zip = "9.7.0"
zstd = "0.14.4"

[dev-dependencies]
bzip2 = "0.6.1"
encoding_rs = "0.8.44"
flate2 = "1.1.11"
sevenz-rust2 = "0.25.0"
tar = "0.4.46"
tempfile = "3.27.0"
xz2 = "0.1.7"
zip = "9.7.0"
zstd = "0.14.4"

[features]
default = ["rar"]
# RAR 풀기 (UnRAR 라이선스 — THIRD-PARTY-NOTICES.md 참고)
rar = ["dep:unrar"]
# 데스크톱 GUI 앱 (opizenAI_Unpack) — Windows / Linux
gui = ["dep:eframe", "dep:rfd"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1

[build-dependencies]
winresource = "0.1.34"

# Linux에서 Windows용으로 교차 빌드할 수 있도록 build.rs만 고친 unrar_sys (vendor/unrar_sys/build.rs 참고)
[patch.crates-io]
unrar_sys = { path = "vendor/unrar_sys" }
